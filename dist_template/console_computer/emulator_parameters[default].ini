// - There MUST be an empty line between sections or the frontend will not be able to read the file!!!
// - Do no edit this file

[Daemon Tools]
// Filenames will always be in this section, no matter the application used
// The "Mount" and "Unmount" entries in this section are for Daemon Tools only
// %s on mount is required and it's replaced by "fullpath\game_filename"
// Daemon Tools valid filenames: dtlite*.exe; daemon*.exe
// Virtual CloneDrive valid filenames: VCDMount.exe
// Alcohol 120% valid filnames: AxCmd.exe
File=
// mount/unmount for Daemon Tools
Mount=-mount scsi, 0, "%s"
Unmount=-unmount scsi, 0

[Virtual CloneDrive]
// mount/unmount for Virtual CloneDrive
Mount=/d=0 "%s"
Unmount=/d=0 /u

[Alcohol 120%]
// mount/unmount for Alcohol 120% and/or Alcohol 52%
Mount=0: /m:"%s"
Unmount=0: /u

[Custom Virtual Drive]
// any other virtual drive application will be stored here
Mount=
Unmount=

